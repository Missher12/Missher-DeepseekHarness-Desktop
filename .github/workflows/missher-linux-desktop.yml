name: Missher Ubuntu Desktop packages

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: Explicit version shared with the Intel Mac build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: missher-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_GATE_CONCURRENCY: '1'
      DSH_REQUESTED_BUILD_VERSION: ${{ inputs.build_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libfuse2t64 xvfb fakeroot
      - run: pnpm install --frozen-lockfile
      - name: Check Linux target and packaging boundaries
        run: pnpm exec vitest run apps/desktop/tests/package-target.spec.ts apps/desktop/tests/desktop-build-paths.spec.ts apps/desktop/tests/desktop-package-environment.spec.ts apps/desktop/tests/runtime-file-policy.spec.ts apps/desktop/tests/installer-packaging.spec.ts apps/desktop/tests/cli-launcher.spec.ts scripts/libreoffice-engine.spec.ts --maxWorkers=1
      - name: Build Linux runtime
        run: |
          cp apps/desktop/.env.linux.example apps/desktop/.env.linux
          pnpm run package:desktop:linux:x64 -- --build-version "$DSH_REQUESTED_BUILD_VERSION"
      - name: Install Debian package and verify visible renderer
        run: |
          artifacts=apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts
          deb=$(realpath "$artifacts/"*.deb)
          sudo apt-get install -y "$deb"
          xvfb-run -a -s '-screen 0 1440x1000x24' node apps/desktop/scripts/smoke-community-shell.mjs "$(command -v deepseek-harness)" desktop-verification
      - name: Upload verified installers and evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: missher-linux-x64-verified
          compression-level: 0
          path: |
            apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.deb
            apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts/*.AppImage
            desktop-verification/
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: missher-linux-x64-diagnostics
          path: |
            apps/desktop/.desktop-build/packaging-runs/
            desktop-verification/
