name: Missher Intel Mac Desktop package

on:
  workflow_call:
    inputs:
      build_version:
        description: Explicit version shared with the Linux build
        required: true
        type: string
      upstream_version:
        description: Upstream dsh-v* version used for release notes and the optional source merge
        required: false
        type: string
        default: ''
      source_ref:
        description: Community branch to build; when upstream_version is set the upstream tag is merged into it
        required: false
        type: string
        default: codex/desktop-rc2-20261017
      publish:
        description: Create a desktop-v* GitHub Release after a successful build
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      build_version:
        description: Explicit version shared with the Linux build
        required: true
        type: string
      upstream_version:
        description: Upstream dsh-v* version used for release notes and the optional source merge
        required: false
        type: string
        default: ''
      source_ref:
        description: Community branch to build; when upstream_version is set the upstream tag is merged into it
        required: false
        type: string
        default: codex/desktop-rc2-20261017
      publish:
        description: Create a desktop-v* GitHub Release after a successful build
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: missher-macos-intel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_GATE_CONCURRENCY: '1'
      DSH_REQUESTED_BUILD_VERSION: ${{ inputs.build_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Merge official upstream tag
        if: inputs.upstream_version != ''
        env:
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          tag="dsh-v${UPSTREAM_VERSION}"
          git fetch --no-tags upstream "refs/tags/${tag}:refs/tags/${tag}"
          if ! git merge --no-edit "$tag"; then
            echo "::error::Merge conflict between ${SOURCE_REF} and ${tag}; resolve the community patch before publishing."
            git diff --name-only --diff-filter=U || true
            exit 1
          fi
          git log -1 --oneline
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Intel packaging boundaries
        run: pnpm exec vitest run apps/desktop/tests/package-target.spec.ts apps/desktop/tests/desktop-build-paths.spec.ts apps/desktop/tests/desktop-package-environment.spec.ts apps/desktop/tests/macos-signature.spec.ts apps/desktop/tests/runtime-file-policy.spec.ts apps/desktop/tests/installer-packaging.spec.ts apps/desktop/tests/cli-launcher.spec.ts --maxWorkers=1
      - name: Check macOS Documents isolation
        run: node apps/desktop/scripts/preflight-macos-documents.mjs desktop-verification
      - name: Build isolated community Intel DMG
        run: |
          cp apps/desktop/.env.community-macos.example apps/desktop/.env.macos
          pnpm run package:desktop:mac:x64:unsigned -- --community --build-version "$DSH_REQUESTED_BUILD_VERSION"
      - name: Verify DMG and actual renderer
        run: |
          artifacts=apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts
          hdiutil verify "$artifacts/deepseek-harness-$DSH_REQUESTED_BUILD_VERSION-mac-x64-unsigned.dmg"
          mkdir -p desktop-verification
          shasum -a 256 "$artifacts/"*.dmg > desktop-verification/SHA256SUMS
          node apps/desktop/scripts/smoke-community-shell.mjs "$artifacts/mac/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness" desktop-verification
      - name: Preserve installers and verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: missher-mac-x64-verified
          compression-level: 0
          path: |
            apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg
            desktop-verification/
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: missher-mac-x64-diagnostics
          path: |
            apps/desktop/.desktop-build/packaging-runs/
            apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg
            desktop-verification/

  release:
    needs: package
    if: inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_VERSION: ${{ inputs.build_version }}
      UPSTREAM_VERSION: ${{ inputs.upstream_version }}
    steps:
      - name: Download verified Intel package
        uses: actions/download-artifact@v4
        with:
          name: missher-mac-x64-verified
          path: artifact

      - name: Locate and verify DMG
        id: files
        run: |
          set -euo pipefail
          mapfile -t dmgs < <(find artifact -type f -name '*-mac-x64-unsigned.dmg' -print)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "expected exactly one DMG, found ${#dmgs[@]}" >&2
            find artifact -type f >&2
            exit 1
          fi
          dmg="${dmgs[0]}"
          sha="$(find artifact -type f -name SHA256SUMS -print -quit)"
          if [ -z "$sha" ]; then
            echo "SHA256SUMS missing from artifact" >&2
            exit 1
          fi
          expected="$(grep -F "$(basename "$dmg")" "$sha" | awk '{print $1}' | head -1)"
          actual="$(sha256sum "$dmg" | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "SHA-256 mismatch for $dmg" >&2
            exit 1
          fi
          printf 'dmg=%s\nsha=%s\n' "$dmg" "$sha" >> "$GITHUB_OUTPUT"

      - name: Compose release notes
        run: |
          set -euo pipefail
          {
            echo "自动构建：Intel Mac x64 社区包（官方源码，未签名）。"
            echo
            printf -- '- 版本：`%s`\n' "$BUILD_VERSION"
            printf -- '- 构建提交：`%s`\n' "$GITHUB_SHA"
            printf -- '- 构建时间：`%s`\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo '- 首次安装可能需要在“系统设置 → 隐私与安全性”中放行。'
            echo
            if [ -n "$UPSTREAM_VERSION" ]; then
              echo "## 上游更新说明（dsh-v${UPSTREAM_VERSION}）"
              echo
              gh release view "dsh-v${UPSTREAM_VERSION}" -R deepseek-ai/deepseek-harness --json body -q .body || true
            fi
          } > notes.md
          cat notes.md

      - name: Create release
        run: |
          set -euo pipefail
          tag="desktop-v${BUILD_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$tag" \
            --title "DeepSeek Harness Desktop ${BUILD_VERSION}" \
            --notes-file notes.md \
            "${{ steps.files.outputs.dmg }}" \
            "${{ steps.files.outputs.sha }}"
